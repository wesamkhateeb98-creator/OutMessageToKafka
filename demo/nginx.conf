worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;

    upstream api {
        server 127.0.0.1:15101 max_fails=0;
        server 127.0.0.1:15102 max_fails=0;
        keepalive 256;
    }

    server {
        listen 18088 backlog=4096;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # One id per client request, unchanged across retries
            proxy_set_header X-Message-Id $request_id;

            # POST is retried only with non_idempotent
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }
    }
}
